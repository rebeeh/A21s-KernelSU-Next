name: Build A21s KernelSU-Next

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: "Optional URL to stock boot.img (to repack boot-ksu.img & Odin boot-ksu.tar)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel, AnyKernel3 & SUSFS Module
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libssl-dev lz4 libncurses5-dev pkg-config python3 python3-pip rsync \
            unzip zip zlib1g-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone Clang Toolchain (clang-r416183b)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git toolchain/clang-r416183b

      - name: Clone Kernel Source & KernelSU-Next
        run: |
          git clone -b lineage-24.0 --depth=1 https://github.com/samsungexynos850/android_kernel_samsung_exynos850.git a21s-kernel
          cd a21s-kernel
          git clone -b legacy --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

      - name: Apply Kernel & KSU Patches
        run: |
          cd a21s-kernel
          git apply ../patches/0001-build-host-openssl-3-compat.patch
          git apply ../patches/0002-kernelsu-manual-hooks-and-backports.patch
          git apply ../patches/0004-susfs-v1.5.5-kernel-4.19.patch
          cd KernelSU-Next
          git apply ../../patches/0003-kernelsu-next-samsung-fixes.patch

      - name: Configure Kernel
        run: |
          cp configs/a21s_ksu_defconfig a21s-kernel/.config

      - name: Build Kernel Image
        run: |
          export PATH="$(pwd)/toolchain/clang-r416183b/bin:${PATH}"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          cd a21s-kernel
          make -j"$(nproc)" Image

      - name: Package AnyKernel3 Zip
        run: |
          mkdir -p out build
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git build/anykernel3
          KERNEL_IMAGE="$(pwd)/a21s-kernel/arch/arm64/boot/Image" bash scripts/package_anykernel3.sh
          unzip -t out/KernelSU-Next-A21s-universal850-AnyKernel3.zip

      - name: Build SUSFS v1.5.5 Companion Module (NDK)
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "${NDK_DIR}" ] || [ ! -x "${NDK_DIR}/ndk-build" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "${NDK_DIR}" ] || [ ! -x "${NDK_DIR}/ndk-build" ]; then
            echo "[+] Downloading Android NDK r27c for ksu_susfs compilation..."
            curl -sL "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -o /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /tmp/ndk
            NDK_DIR=$(ls -d /tmp/ndk/android-ndk-* | head -n 1)
          fi
          export PATH="${NDK_DIR}:${PATH}"
          echo "[+] Using ndk-build: $(command -v ndk-build)"
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu-4.19
          cd /tmp/susfs4ksu-4.19
          ./build_ksu_susfs_tool.sh
          mkdir -p "${GITHUB_WORKSPACE}/out"
          (cd ksu_module_susfs && zip -r9 "${GITHUB_WORKSPACE}/out/susfs4ksu-v1.5.5.zip" .)
          unzip -t "${GITHUB_WORKSPACE}/out/susfs4ksu-v1.5.5.zip"

      - name: Repack Boot Image & Odin Tar (If stock boot provided)
        if: "${{ github.event.inputs.stock_boot_url != '' }}"
        run: |
          curl -sL "${{ github.event.inputs.stock_boot_url }}" -o boot.img
          curl -sL "https://github.com/magiskboot-x86_64/magiskboot/releases/latest/download/magiskboot" -o magiskboot
          chmod +x magiskboot
          mkdir -p repack out
          cd repack
          ../magiskboot unpack ../boot.img
          cp ../a21s-kernel/arch/arm64/boot/Image ./kernel
          ../magiskboot repack ../boot.img ../out/boot-ksu.img
          cd ../out
          cp -f boot-ksu.img boot.img
          tar -cvf boot-ksu.tar boot.img
          rm -f boot.img

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a21s-ksu-kernel-Image
          path: a21s-kernel/arch/arm64/boot/Image

      - name: Upload Flashable Artifacts (AnyKernel3 / SUSFS Module / Boot Images)
        uses: actions/upload-artifact@v4
        with:
          name: a21s-ksu-release-artifacts
          path: |
            out/*.zip
            out/*.img
            out/*.tar

      - name: Attach Artifacts to GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.img
            out/*.tar
